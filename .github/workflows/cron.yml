name: Run applications
# Calls your backend 8 times a day (06:00-20:00 UTC = 07:00-21:00 Lagos time).
# Keep this in sync with "Runs per day" in Admin > Settings (default 8).
on:
  schedule:
    - cron: '0 6-20/2 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend and start a run
        run: |
          curl --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "${{ secrets.BACKEND_URL }}/api/cron/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
